    "dill>=0.3.4",
    "einops>=0.3.2",
    "fastprogress>=1.0.0",
    "graphviz>=0.17",
    "hyperopt>=0.2.7",
    "ipython>=7.29.0",
    "jieba>=0.42.1",
    "jieba-fast>=0.53",
    "lightgbm>=3.3.1",
    "markdown>=3.6",
    "matplotlib>=3.4.3",
    "nltk>=3.6.5",
    "numpy>=1.20.3",
    "opencv-python>=4.5.4.58",
    "oss2>=2.15.0",
    "pandas>=1.3.4",
    "pdfkit>=1.0.0",
    "prettytable>=3.11.0",
    "pyopenssl>=22.0.0",
    "pytest>=6.2.5",
    "pyyaml>=5.4.1",
    "requests>=2.26.0",
    "retrying>=1.3.3",
    "sacremoses>=0.0.46",
    "scikit-learn>=0.24.2",
    "scipy>=1.7.2",
    "seaborn>=0.11.2",
    "setuptools>=58.0.4",
    "spacy>=3.1.4",
    "tabulate>=0.8.9",
    "torch>=1.10.0",
    "tqdm>=4.62.3",
    "transformers>=4.12.5",
    "treelib>=1.6.1",
    "xgboost>=1.3.3",
